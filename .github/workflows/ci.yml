name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up CMake
      uses: lukka/get-cmake@latest
    
    - name: Install LLVM/Clang on Ubuntu
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-18 llvm-18-dev libclang-18-dev clang-18
        echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV
        echo "Clang_DIR=/usr/lib/llvm-18/lib/cmake/clang" >> $GITHUB_ENV
    
    - name: Install LLVM/Clang on macOS
      if: runner.os == 'macOS'
      run: |
        brew install llvm@18
        echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> $GITHUB_ENV
        echo "Clang_DIR=$(brew --prefix llvm@18)/lib/cmake/clang" >> $GITHUB_ENV
        echo "$(brew --prefix llvm@18)/bin" >> $GITHUB_PATH
    
    - name: Install LLVM/Clang on Windows
      if: runner.os == 'Windows'
      run: |
        Write-Host "Windows binary LLVM packages lack Clang C++ API headers and static libraries."
        Write-Host "LLVM/Clang will be built from source via XCCMETA_LLVM_FETCH=ON."

    - name: Cache LLVM source and build (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: .llvm-deps
        key: llvm-18.1.8-win-${{ matrix.build_type }}-v1

    - name: Configure CMake
      shell: pwsh
      run: |
        $cmakeArgs = @(
          '-B', 'build',
          "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}",
          '-DXCCMETA_BUILD_TESTS=ON'
        )
        if ("${{ runner.os }}" -eq "Windows") {
          $cmakeArgs += '-DXCCMETA_LLVM_FETCH=ON'
          $cmakeArgs += "-DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.llvm-deps"
        } else {
          $cmakeArgs += '-DXCCMETA_LLVM_FETCH=OFF'
        }
        cmake @cmakeArgs
    
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}
    
    - name: Run tests
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure --verbose
    
    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/Testing/Temporary/LastTest.log
          build/Testing/Temporary/LastTestsFailed.log
        if-no-files-found: ignore
